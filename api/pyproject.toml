[project]
name = "rerupa-api"
version = "0.1.0"
description = "Backend Rerupa: API FastAPI, worker, pipeline CV, integrasi AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "openai>=3.57.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "slowapi>=0.1.10",
    "supabase>=2.34.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

# Image deploy (Linux) memakai torch versi CPU: tanpa pustaka CUDA, image jauh lebih kecil.
# Windows/macOS tetap memakai wheel PyPI (sudah CPU).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
cv = [
    "colour-science>=0.4.7",
    "controlnet-aux>=0.0.10",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pymixbox>=2.0.0",
    "rembg[cpu]>=2.0.87",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    # Dinyatakan langsung (dipakai controlnet-aux) agar sumber pytorch-cpu di bawah berlaku.
    "torch>=2.15.0",
    "torchvision",
]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
