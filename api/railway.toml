# Config-as-code Railway untuk service API. Service worker memakai repo + Dockerfile yang sama;
# di dashboard set Start Command = "python worker.py" dan hapus healthcheck (worker tanpa port).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
